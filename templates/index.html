<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Lens - 卡牌圖鑑與相機辨識</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --surface-soft: #f1f5f9;
            --ink: #10233f;
            --muted: #64748b;
            --line: #e2e8f0;
            --blue: #1677ff;
            --blue-deep: #0756b8;
            --amber: #f6d854;
            --coral: #ff6f59;
            --sea: #4d90fe;
            --mint: #5dbe7e;
            --psychic: #a55eea;
            --shadow: 0 10px 30px rgba(15, 35, 63, 0.08);
            --shadow-lg: 0 24px 70px rgba(15, 35, 63, 0.18);
            --radius-xl: 24px;
            --radius-lg: 18px;
            --type-accent: var(--blue);
            --type-glow: rgba(77, 144, 254, 0.18);
        }

        * { box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--ink);
            font-family: "Manrope", "Noto Sans TC", sans-serif;
            background:
                radial-gradient(circle at 8% 4%, rgba(77, 144, 254, 0.11), transparent 27rem),
                radial-gradient(circle at 90% 20%, rgba(246, 216, 84, 0.13), transparent 24rem),
                linear-gradient(180deg, #fff 0, var(--bg) 28rem);
        }

        button, input, select { font: inherit; }
        button { -webkit-tap-highlight-color: transparent; }
        .mono { font-family: "JetBrains Mono", monospace; font-variant-numeric: tabular-nums; }

        .navbar {
            position: sticky;
            top: 0;
            z-index: 50;
            padding: 14px clamp(18px, 4vw, 56px);
            border-bottom: 1px solid rgba(226, 232, 240, 0.78);
            background: rgba(255, 255, 255, 0.76);
            backdrop-filter: blur(18px);
        }

        .nav-inner {
            max-width: 1240px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 11px;
            color: var(--ink);
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            text-decoration: none;
        }

        .brand-mark {
            display: grid;
            width: 38px;
            height: 38px;
            place-items: center;
            color: white;
            border-radius: 13px;
            background: linear-gradient(145deg, #1685ff, #0756b8);
            box-shadow: 0 8px 18px rgba(22, 119, 255, 0.22);
        }

        .nav-status {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--muted);
            font-size: 0.82rem;
            font-weight: 700;
        }

        .nav-status::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--mint);
            box-shadow: 0 0 0 5px rgba(93, 190, 126, 0.12);
        }

        .container-main {
            width: min(1240px, calc(100% - 32px));
            margin: auto;
            padding: clamp(42px, 7vw, 92px) 0 80px;
        }

        .search-section { text-align: center; }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 18px;
            padding: 8px 12px;
            color: var(--blue-deep);
            border: 1px solid #cfe4ff;
            border-radius: 999px;
            background: rgba(239, 247, 255, 0.9);
            font-size: 0.76rem;
            font-weight: 800;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .search-section h1 {
            max-width: 820px;
            margin: 0 auto 18px;
            color: var(--ink);
            font-size: clamp(2.25rem, 5vw, 4.7rem);
            font-weight: 850;
            letter-spacing: -0.06em;
            line-height: 1.02;
        }

        .hero-accent { color: var(--blue); }

        .hero-copy {
            max-width: 650px;
            margin: 0 auto;
            color: var(--muted);
            font-size: clamp(1rem, 2vw, 1.13rem);
            line-height: 1.75;
        }

        .search-panel {
            position: relative;
            max-width: 900px;
            margin: 36px auto 0;
            padding: clamp(18px, 3vw, 30px);
            overflow: hidden;
            border: 1px solid rgba(226, 232, 240, 0.9);
            border-radius: var(--radius-xl);
            background: rgba(255, 255, 255, 0.9);
            box-shadow: var(--shadow);
            backdrop-filter: blur(16px);
        }

        .search-panel::before {
            content: "";
            position: absolute;
            inset: 0 auto auto 10%;
            width: 80%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(22, 119, 255, 0.55), transparent);
        }

        .search-input-group {
            display: grid;
            grid-template-columns: 1fr auto auto;
            gap: 10px;
            align-items: center;
        }

        .search-field {
            position: relative;
            min-width: 0;
        }

        .search-field i {
            position: absolute;
            top: 50%;
            left: 18px;
            color: #94a3b8;
            transform: translateY(-50%);
        }

        .search-input-group input {
            width: 100%;
            min-height: 56px;
            padding: 0 18px 0 49px;
            color: var(--ink);
            border: 1px solid var(--line);
            border-radius: 16px;
            outline: none;
            background: #f8fafc;
            transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
        }

        .search-input-group input:focus {
            border-color: rgba(22, 119, 255, 0.68);
            background: white;
            box-shadow: 0 0 0 4px rgba(22, 119, 255, 0.1);
        }

        .primary-action, .scan-action {
            min-height: 56px;
            padding: 0 22px;
            border: 0;
            border-radius: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: transform .2s ease, box-shadow .2s ease;
        }

        .primary-action {
            color: white;
            background: linear-gradient(135deg, var(--blue), var(--blue-deep));
            box-shadow: 0 9px 20px rgba(22, 119, 255, 0.24);
        }

        .scan-action {
            color: var(--blue-deep);
            border: 1px solid #cfe4ff;
            background: #eff7ff;
        }

        .primary-action:hover, .scan-action:hover { transform: translateY(-2px); }

        .platform-tabs {
            display: inline-flex;
            gap: 5px;
            margin-top: 22px;
            padding: 5px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: var(--surface-soft);
        }

        .platform-btn {
            padding: 10px 16px;
            color: var(--muted);
            border: 0;
            border-radius: 999px;
            background: transparent;
            font-size: 0.86rem;
            font-weight: 750;
            cursor: pointer;
            transition: all .2s ease;
        }

        .platform-btn.active {
            color: var(--ink);
            background: white;
            box-shadow: 0 4px 14px rgba(15, 35, 63, 0.1);
        }

        .search-meta {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 12px;
            align-items: center;
            margin-top: 18px;
            text-align: left;
        }

        #searchHint, #cardSourceSelector {
            min-height: 48px;
            padding: 12px 15px;
            color: var(--muted);
            border: 1px solid var(--line);
            border-radius: 14px;
            background: #fbfdff;
            font-size: 0.84rem;
        }

        #searchHint strong { color: var(--ink); }

        #cardSourceSelector label {
            margin-right: 8px;
            color: var(--muted);
            font-weight: 700;
        }

        #cardSource {
            padding: 7px 30px 7px 10px;
            color: var(--ink);
            border: 1px solid var(--line);
            border-radius: 10px;
            background: white;
        }

        .quick-searches {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-top: 16px;
        }

        .quick-search-btn {
            padding: 8px 13px;
            color: #475569;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: white;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            transition: all .2s ease;
        }

        .quick-search-btn:hover {
            color: var(--blue-deep);
            border-color: #b9d9ff;
            background: #eff7ff;
            transform: translateY(-1px);
        }

        .results-section {
            display: none;
            margin-top: 60px;
        }

        .results-section.active { display: block; }

        .platform-results {
            margin-bottom: 52px;
            animation: reveal .45s both;
        }

        .platform-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 20px;
        }

        .platform-header::before {
            content: "";
            width: 5px;
            height: 32px;
            border-radius: 99px;
            background: var(--blue);
        }

        .platform-header h2 {
            margin: 0;
            color: var(--ink);
            font-size: clamp(1.2rem, 2vw, 1.55rem);
            font-weight: 850;
            letter-spacing: -0.035em;
        }

        .result-count {
            margin-left: auto;
            padding: 7px 11px;
            color: var(--muted);
            border: 1px solid var(--line);
            border-radius: 999px;
            background: white;
            font-family: "JetBrains Mono", monospace;
            font-size: .76rem;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .catalog-card {
            position: relative;
            display: flex;
            min-width: 0;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(226, 232, 240, 0.92);
            border-radius: 22px;
            background: white;
            box-shadow: 0 8px 25px rgba(15, 35, 63, 0.06);
            cursor: pointer;
            transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
        }

        .catalog-card:hover {
            border-color: #c4dcf8;
            transform: translateY(-6px);
            box-shadow: 0 18px 40px rgba(15, 35, 63, 0.12);
        }

        .catalog-image {
            display: grid;
            min-height: 290px;
            place-items: center;
            padding: 18px;
            background:
                radial-gradient(circle at 20% 15%, rgba(255,255,255,.95), transparent 35%),
                linear-gradient(145deg, #edf5ff, #f8fafc 55%, #fff9df);
        }

        .catalog-image img {
            width: min(100%, 185px);
            max-height: 260px;
            object-fit: contain;
            border-radius: 8px;
            filter: drop-shadow(0 13px 13px rgba(15,35,63,.17));
            transition: transform .28s ease;
        }

        .catalog-card:hover .catalog-image img { transform: scale(1.025) rotate(-.6deg); }

        .catalog-info { padding: 18px; }

        .catalog-name {
            margin-bottom: 10px;
            color: var(--ink);
            font-size: 1rem;
            font-weight: 850;
            line-height: 1.35;
        }

        .card-metadata {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin-top: 12px;
        }

        .mini-chip {
            padding: 5px 8px;
            color: #475569;
            border-radius: 8px;
            background: var(--surface-soft);
            font-size: .69rem;
            font-weight: 750;
        }

        .no-results, .loading {
            padding: 50px 20px;
            color: var(--muted);
            text-align: center;
            border: 1px dashed #cbd5e1;
            border-radius: var(--radius-xl);
            background: rgba(255,255,255,.66);
        }

        /* Camera scanner */
        #scannerModal .modal-dialog {
            width: min(92vw, 780px);
            max-width: none;
        }

        #scannerModal .modal-content {
            overflow: hidden;
            border: 1px solid rgba(255,255,255,.65);
            border-radius: 28px;
            background: #0c1524;
            box-shadow: var(--shadow-lg);
        }

        .scanner-stage {
            position: relative;
            min-height: min(76vh, 700px);
            overflow: hidden;
            background: #0c1524;
        }

        #camera-video {
            width: 100%;
            height: min(76vh, 700px);
            display: block;
            object-fit: cover;
        }

        .scanner-shade {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 0 29%, rgba(6, 14, 26, .44) 62%, rgba(6, 14, 26, .76));
        }

        .scanner-toolbar {
            position: absolute;
            z-index: 5;
            top: 16px;
            left: 50%;
            display: flex;
            width: max-content;
            max-width: calc(100% - 28px);
            align-items: center;
            gap: 9px;
            padding: 8px 9px 8px 14px;
            border: 1px solid rgba(255,255,255,.72);
            border-radius: 999px;
            background: rgba(255,255,255,.67);
            box-shadow: 0 8px 24px rgba(0,0,0,.13);
            backdrop-filter: blur(12px);
            transform: translateX(-50%);
        }

        .scanner-status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--sea);
            box-shadow: 0 0 0 5px rgba(77,144,254,.13);
            animation: statusPulse 1.8s infinite;
        }

        .scanner-status-label {
            color: var(--ink);
            font-size: .78rem;
            font-weight: 800;
            white-space: nowrap;
        }

        .scanner-control {
            display: grid;
            width: 36px;
            height: 36px;
            place-items: center;
            color: var(--ink);
            border: 0;
            border-radius: 50%;
            background: white;
            cursor: pointer;
        }

        .scanner-reticle {
            position: absolute;
            z-index: 3;
            top: 50%;
            left: 50%;
            width: min(54vw, 280px);
            aspect-ratio: 63 / 88;
            border: 2px solid rgba(91, 164, 255, .95);
            border-radius: 18px;
            box-shadow: 0 0 0 1px rgba(255,255,255,.24) inset, 0 0 28px rgba(77,144,254,.68);
            pointer-events: none;
            transform: translate(-50%, -50%);
            animation: scanBreath 2.1s ease-in-out infinite;
        }

        .scanner-reticle::before, .scanner-reticle::after {
            content: "";
            position: absolute;
            inset: -2px;
            border-radius: inherit;
        }

        .scanner-reticle::before {
            background: linear-gradient(110deg, transparent 25%, rgba(255,255,255,.7) 46%, transparent 62%);
            background-size: 250% 100%;
            mix-blend-mode: screen;
            animation: scannerFlow 2.4s linear infinite;
        }

        .scanner-reticle::after {
            inset: 12px;
            border: 1px solid rgba(255,255,255,.15);
        }

        .scanner-shell.locked .scanner-reticle {
            border-color: #34d399;
            box-shadow: 0 0 0 1px rgba(255,255,255,.3) inset, 0 0 35px rgba(52,211,153,.84);
            animation: lockPulse .58s ease-out 2;
        }

        .scanner-shell.locked .scanner-status-dot { background: #10b981; }
        .scanner-shell.locked .scanner-status-label { color: #047857; }

        #scan-status {
            position: absolute;
            z-index: 5;
            right: 18px;
            bottom: 18px;
            left: 18px;
            padding: 12px 16px;
            color: white;
            border: 1px solid rgba(255,255,255,.16);
            border-radius: 14px;
            background: rgba(5,12,22,.52);
            backdrop-filter: blur(12px);
            font-size: .86rem;
            font-weight: 700;
            text-align: center;
        }

        /* Bottom sheet */
        #cardModal { --bs-modal-bg: transparent; }

        #cardModal .modal-dialog {
            display: flex;
            width: 100%;
            max-width: none;
            min-height: 100%;
            margin: 0;
            align-items: flex-end;
        }

        #cardModal .modal-content {
            max-height: min(88vh, 820px);
            overflow: hidden;
            border: 1px solid rgba(255,255,255,.8);
            border-radius: 30px 30px 0 0;
            background:
                radial-gradient(circle at 12% 0, var(--type-glow), transparent 28rem),
                rgba(255,255,255,.97);
            box-shadow: 0 -24px 70px rgba(15,35,63,.2);
            backdrop-filter: blur(22px);
            transform-origin: center bottom;
        }

        #cardModal.show .modal-content { animation: sheetIn .38s cubic-bezier(.2,.8,.2,1); }

        .sheet-handle {
            width: 100%;
            padding: 13px 0 5px;
            border: 0;
            background: transparent;
            cursor: grab;
            touch-action: none;
        }

        .sheet-handle::after {
            content: "";
            display: block;
            width: 48px;
            height: 5px;
            margin: auto;
            border-radius: 99px;
            background: #cbd5e1;
        }

        #cardModal .modal-header {
            padding: 8px clamp(20px, 4vw, 48px) 14px;
            border-bottom: 1px solid var(--line);
            background: transparent;
        }

        #cardModal .modal-title {
            color: var(--ink);
            font-size: clamp(1.15rem, 2.5vw, 1.55rem);
            font-weight: 850;
            letter-spacing: -.035em;
        }

        #cardModal .modal-body {
            overflow-y: auto;
            padding: clamp(22px, 4vw, 42px);
        }

        .detail-layout {
            display: grid;
            grid-template-columns: minmax(220px, 360px) minmax(0, 1fr);
            gap: clamp(28px, 5vw, 70px);
            max-width: 1080px;
            margin: auto;
            align-items: center;
        }

        .holo-stage { perspective: 950px; }

        .holo-card {
            --pointer-x: 50%;
            --pointer-y: 50%;
            --rotate-x: 0deg;
            --rotate-y: 0deg;
            --holo-opacity: 0;
            position: relative;
            width: min(100%, 330px);
            margin: auto;
            aspect-ratio: 63 / 88;
            overflow: hidden;
            border-radius: 4.6% / 3.3%;
            box-shadow: 0 26px 45px rgba(15,35,63,.24), 0 0 0 1px rgba(255,255,255,.8);
            transform: rotateX(var(--rotate-x)) rotateY(var(--rotate-y)) translateZ(0);
            transform-style: preserve-3d;
            transition: transform .18s ease-out, box-shadow .25s ease;
            will-change: transform;
            touch-action: none;
        }

        .holo-card img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }

        .holo-shine, .holo-glare {
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            opacity: var(--holo-opacity);
            transition: opacity .25s ease;
        }

        .holo-shine {
            z-index: 2;
            background:
                repeating-linear-gradient(115deg,
                    rgba(255,110,110,.75) 0%, rgba(255,222,94,.72) 10%,
                    rgba(111,255,192,.7) 20%, rgba(91,184,255,.75) 30%,
                    rgba(196,122,255,.73) 40%, rgba(255,110,110,.75) 50%),
                radial-gradient(circle at var(--pointer-x) var(--pointer-y), rgba(255,255,255,.9), rgba(255,255,255,0) 42%);
            background-size: 220% 220%, 100% 100%;
            background-position: calc(var(--pointer-x) * .8) calc(var(--pointer-y) * .8), center;
            filter: brightness(1.05) contrast(1.25) saturate(1.35);
            mix-blend-mode: color-dodge;
        }

        .holo-card.is-holo .holo-shine::after {
            content: "";
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(circle at 18% 22%, rgba(255,255,255,.85) 0 1px, transparent 2px),
                radial-gradient(circle at 72% 62%, rgba(255,255,255,.8) 0 1.5px, transparent 2.5px),
                radial-gradient(circle at 44% 78%, rgba(255,255,255,.65) 0 1px, transparent 2px);
            background-size: 48px 52px, 73px 67px, 92px 86px;
            transform: translate(calc((var(--pointer-x) - 50%) * .08), calc((var(--pointer-y) - 50%) * .08));
            mix-blend-mode: screen;
        }

        .holo-glare {
            z-index: 3;
            background: radial-gradient(circle at var(--pointer-x) var(--pointer-y), rgba(255,255,255,.72), rgba(255,255,255,.08) 30%, rgba(0,0,0,.12) 72%);
            mix-blend-mode: overlay;
        }

        .holo-card:not(.is-holo) .holo-shine { display: none; }
        .holo-card:not(.is-holo) .holo-glare { opacity: calc(var(--holo-opacity) * .42); }

        .detail-copy { min-width: 0; }

        .source-badge {
            display: inline-flex;
            align-items: center;
            margin-bottom: 13px;
            padding: 7px 11px;
            color: var(--type-accent);
            border: 1px solid color-mix(in srgb, var(--type-accent) 28%, white);
            border-radius: 999px;
            background: color-mix(in srgb, var(--type-accent) 9%, white);
            font-size: .74rem;
            font-weight: 850;
        }

        .detail-name {
            margin: 0 0 8px;
            color: var(--ink);
            font-size: clamp(2rem, 5vw, 4rem);
            font-weight: 900;
            letter-spacing: -.065em;
            line-height: 1;
        }

        .detail-number {
            color: var(--muted);
            font-family: "JetBrains Mono", monospace;
            font-size: .78rem;
        }

        .stat-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 9px;
            margin: 24px 0;
        }

        .stat-chip {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 9px 12px;
            color: #334155;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: white;
            box-shadow: 0 4px 12px rgba(15,35,63,.05);
            font-size: .78rem;
            font-weight: 800;
        }

        .stat-chip.hp {
            color: #047857;
            border-color: #bbf7d0;
            background: #ecfdf5;
            font-family: "JetBrains Mono", monospace;
        }

        .stat-chip.rarity.high {
            color: #6b4d00;
            border-color: rgba(215,170,20,.36);
            background: linear-gradient(115deg, #fff4b5, #ffe07a 45%, #fff8cf);
            box-shadow: 0 7px 18px rgba(215,170,20,.16);
        }

        .detail-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .detail-cell {
            padding: 14px;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: rgba(255,255,255,.74);
        }

        .detail-cell span {
            display: block;
            margin-bottom: 5px;
            color: var(--muted);
            font-size: .68rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .08em;
        }

        .detail-cell strong {
            display: block;
            color: var(--ink);
            font-size: .9rem;
            font-weight: 800;
            overflow-wrap: anywhere;
        }

        .skills-block { margin-top: 18px; }
        .skills-title { margin: 0 0 10px; font-size: .82rem; font-weight: 850; }
        .skill-card { padding: 13px; border-radius: 13px; background: var(--surface-soft); margin-top: 8px; }
        .skill-card strong { color: var(--ink); }
        .skill-card p { margin: 5px 0 0; color: var(--muted); font-size: .8rem; line-height: 1.55; }

        .btn-close { box-shadow: none !important; }

        @keyframes reveal {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes sheetIn {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        @keyframes scanBreath {
            0%, 100% { opacity: .72; filter: brightness(.92); }
            50% { opacity: 1; filter: brightness(1.22); }
        }

        @keyframes scannerFlow {
            from { background-position: 150% 0; }
            to { background-position: -120% 0; }
        }

        @keyframes lockPulse {
            0% { transform: translate(-50%, -50%) scale(1); }
            55% { transform: translate(-50%, -50%) scale(1.035); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

        @keyframes statusPulse {
            0%,100% { transform: scale(.85); }
            50% { transform: scale(1.15); }
        }

        @media (max-width: 760px) {
            .nav-status span { display: none; }
            .container-main { width: min(100% - 22px, 1240px); padding-top: 38px; }
            .search-input-group { grid-template-columns: 1fr 56px; }

            .scanner-reticle { width: min(62vw, 270px); }

        @media (max-width: 430px) {

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;

    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentMatchName = '';
        let matchCounter = 0;
        let currentSearchResults = {};
        
        // 分頁狀態
        let currentCardSearch = {
            keyword: '',
            source: 'all',
            page: 1,
            limit: 50,
            results: null
        };

        /** 根據卡牌屬性獲取動態漸層背景 */
        function getTypeGradient(card) {
            const stats = card.stats || {};
            let type = '';
            
            if (card.source === 'pokemon' && card.type) {
                type = card.type.toLowerCase();
            } else if (card.source === 'tw-pokemon' || card.source === 'pokemon-jp') {
                // 台灣寶可夢使用 type_color 和 pokemon_type 欄位
                if (card.type_color) {
                    return `linear-gradient(145deg, ${card.type_color.primary || '#a8a878'}, ${card.type_color.secondary || '#6d6d4f'})`;
                }
                type = card.type ? card.type.toLowerCase() : '';
            } else if (card.source === 'yugioh' && stats.attribute) {
                type = stats.attribute.toLowerCase();
            }
            
            // 台灣寶可夢屬性對應 (繁體中文)
            const twPokemonGradients = {
                '火': 'linear-gradient(145deg, #f08030, #a81828)',
                '水': 'linear-gradient(145deg, #6890f0, #38609c)',
                '草': 'linear-gradient(145deg, #78c850, #486838)',
                '雷': 'linear-gradient(145deg, #f8d030, #a8a820)',
                '冰': 'linear-gradient(145deg, #98d8d8, #686860)',
                '格鬥': 'linear-gradient(145deg, #c03028, #90210e)',
                '毒': 'linear-gradient(145deg, #a040a0, #782a58)',
                '地面': 'linear-gradient(145deg, #e0c068, #804020)',
                '飛行': 'linear-gradient(145deg, #a890f0, #6858a8)',
                '超': 'linear-gradient(145deg, #f85888, #a82860)',
                '蟲': 'linear-gradient(145deg, #a8b820, #6d7815)',
                '岩': 'linear-gradient(145deg, #b8a038, #786824)',
                '幽靈': 'linear-gradient(145deg, #705898, #493963)',
                '龍': 'linear-gradient(145deg, #7038f8, #4924a8)',
                '惡': 'linear-gradient(145deg, #705848, #49392f)',
                '鋼': 'linear-gradient(145deg, #b8b8d0, #78787c)',
                '妖精': 'linear-gradient(145deg, #ee99ac, #c23e5b)',
            };
            
            // 英文屬性對應
            const gradients = {
                'fire': 'linear-gradient(145deg, #a80000, #000000)',
                'water': 'linear-gradient(145deg, #003366, #000000)',
                'grass': 'linear-gradient(145deg, #1b4d3e, #000000)',
                'leaf': 'linear-gradient(145deg, #1b4d3e, #000000)',
                'electric': 'linear-gradient(145deg, #b8860b, #1a1a1a)',
                'psychic': 'linear-gradient(145deg, #4b0082, #000000)',
                'dark': 'linear-gradient(145deg, #4b0082, #000000)',
                'default': 'linear-gradient(145deg, #2c3e50, #000000)'
            };
            
            // 優先使用台灣寶可夢的繁中屬性
            if ((card.source === 'tw-pokemon' || card.source === 'pokemon-jp') && type in twPokemonGradients) {
                return twPokemonGradients[type];
            }
            
            return gradients[type] || gradients['default'];
        }

        /** 打開卡牌詳情模態框 */
        let holoTiltController = null;

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, char => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
            })[char]);
        }

        function getTypeTheme(type) {
            const key = String(type || '').toLowerCase();
            const themes = [
                { match: ['雷', '電', 'lightning', 'electric'], accent: '#d6a900', glow: 'rgba(246,216,84,.28)', icon: 'fa-bolt' },
                { match: ['火', 'fire'], accent: '#ff6f59', glow: 'rgba(255,111,89,.22)', icon: 'fa-fire' },
                { match: ['水', 'water'], accent: '#4d90fe', glow: 'rgba(77,144,254,.22)', icon: 'fa-droplet' },
                { match: ['草', 'grass'], accent: '#36a967', glow: 'rgba(93,190,126,.22)', icon: 'fa-leaf' },
                { match: ['超', 'psychic'], accent: '#a55eea', glow: 'rgba(165,94,234,.2)', icon: 'fa-eye' }
            ];
            return themes.find(theme => theme.match.some(token => key.includes(token)))
                || { accent: '#1677ff', glow: 'rgba(77,144,254,.18)', icon: 'fa-gem' };
        }

        function isHighRarity(rarity) {
            const value = String(rarity || '').toUpperCase().replace(/\s+/g, '');
            if (!value || ['C', 'U', 'U/C', 'COMMON', 'UNCOMMON', '未標示'].includes(value)) return false;
            return /SAR|AR|SR|UR|RRR|RR|CHR|CSR|ACE|RARE|SECRET|HOLO/.test(value) || value === 'R';
        }

        function initHoloTilt(cardElement, isHolo) {
            if (holoTiltController) holoTiltController.abort();
            holoTiltController = new AbortController();
            const { signal } = holoTiltController;
            const update = event => {
                const point = event.touches?.[0] || event;
                const rect = cardElement.getBoundingClientRect();
                const x = Math.max(0, Math.min(1, (point.clientX - rect.left) / rect.width));
                const y = Math.max(0, Math.min(1, (point.clientY - rect.top) / rect.height));
                cardElement.style.setProperty('--pointer-x', `${Math.round(x * 100)}%`);
                cardElement.style.setProperty('--pointer-y', `${Math.round(y * 100)}%`);
                cardElement.style.setProperty('--rotate-x', `${((.5 - y) * 16).toFixed(2)}deg`);
                cardElement.style.setProperty('--rotate-y', `${((x - .5) * 18).toFixed(2)}deg`);
                cardElement.style.setProperty('--holo-opacity', isHolo ? '.78' : '.22');
            };
            const reset = () => {
                cardElement.style.setProperty('--rotate-x', '0deg');
                cardElement.style.setProperty('--rotate-y', '0deg');
                cardElement.style.setProperty('--pointer-x', '50%');
                cardElement.style.setProperty('--pointer-y', '50%');
                cardElement.style.setProperty('--holo-opacity', '0');
            };
            cardElement.addEventListener('pointermove', update, { signal });
            cardElement.addEventListener('touchmove', update, { signal, passive: true });
            cardElement.addEventListener('pointerleave', reset, { signal });
            cardElement.addEventListener('touchend', reset, { signal });
        }

        function showCardDetail(card) {
            const modalElement = document.getElementById('cardModal');
            const modal = bootstrap.Modal.getOrCreateInstance(modalElement);
            const imageUrl = card.image_url || card.img_large || card.img_url || '';
            const displayName = card.name || card.title || '未命名卡牌';
            const rarity = card.rarity || '未標示';
            const highRarity = isHighRarity(rarity);
            const theme = getTypeTheme(card.type);
            const modalContent = modalElement.querySelector('.modal-content');
            const tiltCard = document.getElementById('cardTilt');

            modalContent.style.setProperty('--type-accent', theme.accent);
            modalContent.style.setProperty('--type-glow', theme.glow);
            tiltCard.classList.toggle('is-holo', highRarity);
            document.getElementById('cardModalTitle').textContent = displayName;
            document.getElementById('cardModalImage').src = imageUrl;
            document.getElementById('cardModalImage').alt = `${displayName} 卡牌原圖`;

            const stats = card.stats || {};
            const source = getSourceName(card.source);
            const number = card.number || card.id || '-';
            const skills = Array.isArray(card.skills) ? card.skills : [];
            const hasHp = card.hp !== undefined && card.hp !== null && card.hp !== '' && card.hp !== '-';

            let html = `
                <span class="source-badge">${escapeHtml(source)}</span>
                <h2 class="detail-name">${escapeHtml(displayName)}</h2>
                <div class="detail-number">NO. ${escapeHtml(number)}</div>
                <div class="stat-chips">
                    ${hasHp ? `<span class="stat-chip hp"><i class="fa-solid fa-heart-pulse"></i> HP ${escapeHtml(card.hp)}</span>` : ''}
                    <span class="stat-chip"><i class="fa-solid ${theme.icon}"></i> ${escapeHtml(card.type || '未標示')}</span>
                    <span class="stat-chip rarity ${highRarity ? 'high' : ''}"><i class="fa-solid fa-star"></i> ${escapeHtml(rarity)}</span>
                </div>
                <div class="detail-grid">
                    <div class="detail-cell"><span>系列</span><strong>${escapeHtml(card.series || '未標示')}</strong></div>
                    <div class="detail-cell"><span>卡片編號</span><strong class="mono">${escapeHtml(number)}</strong></div>
                    <div class="detail-cell"><span>版本來源</span><strong>${escapeHtml(source)}</strong></div>
                </div>`;

            if (card.source === 'yugioh') {
                html += `<div class="detail-grid" style="margin-top:10px">
                    <div class="detail-cell"><span>卡片種類</span><strong>${escapeHtml(stats.card_type || '未標示')}</strong></div>
                    <div class="detail-cell"><span>ATK / DEF</span><strong class="mono">${escapeHtml(stats.atk ?? '-')} / ${escapeHtml(stats.def ?? '-')}</strong></div>
                </div>`;
            }

            if (skills.length) {
                html += `<div class="skills-block"><h3 class="skills-title">招式與能力</h3>${skills.map(skill => `
                    <div class="skill-card">
                        <strong>${escapeHtml(skill.name || '未命名招式')} ${skill.damage ? `· ${escapeHtml(skill.damage)}` : ''}</strong>
                        ${skill.effect ? `<p>${escapeHtml(skill.effect)}</p>` : ''}
                    </div>`).join('')}</div>`;
            }

            document.getElementById('cardModalDetails').innerHTML = html;
            initHoloTilt(tiltCard, highRarity);
            modal.show();
        }
        function getSourceName(source) {
            const names = {
                'pokemon': '寶可夢 TCG (國際)',
                'pokemon-en': '寶可夢 TCG (國際英文)',
                'yugioh': '遊戲王',
                'tw-pokemon': '🇹🇼 寶可夢 TCG (台灣繁中)',
                'pokemon-jp': '🇯🇵 寶可夢 TCG (日本官方)'
            };
            return names[source] || source;
        }

        /** 改變卡牌來源 */
        function changeCardSource(source) {
            console.log('改變卡牌來源:', source);
            currentCardSearch.source = source;
            currentCardSearch.page = 1;  // 重置到第 1 頁
            
            // 動態更新 Placeholder
            const searchInput = document.getElementById('searchKeyword');
            if (source === 'tw-pokemon') {
                searchInput.placeholder = "請輸入中文名稱或卡號（如：皮卡丘 或 sv4a-127）";
            } else if (source === 'pokemon-jp') {
                searchInput.placeholder = "日本公式カードを検索（例：ピカチュウ、リザードン）";
            } else if (source === 'pokemon') {
                searchInput.placeholder = "Please enter English name (e.g., Pikachu 或 id:sv4a-127)";
            } else if (source === 'yugioh') {
                searchInput.placeholder = "搜尋遊戲王卡牌 (如: 黑魔導)";
            }
        }

        /** 快速搜尋按鈕 */
        function quickSearch(keyword) {
            document.getElementById('searchKeyword').value = keyword;
            performSearch();
        }

        /** 執行搜尋 */
        async function performSearch() {
            const keyword = document.getElementById('searchKeyword').value.trim();
            if (!keyword || keyword.length < 2) {
                alert('請輸入至少 2 個字符');
                return;
            }

            currentCardSearch.keyword = keyword;
            currentCardSearch.page = 1;
            await performCardSearch();
        }
        
        /** 國際卡牌搜尋（支持分頁） */
        async function performCardSearch() {
            const { keyword, source, page, limit } = currentCardSearch;
            
            try {
                const url = `/api/cards/search?keyword=${encodeURIComponent(keyword)}&source=${source}&page=${page}&limit=${limit}`;
                console.log('📡 [API 請求] 卡牌搜尋:', url);
                
                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    credentials: 'include'
                });
                
                console.log(`📊 [API 回應] 狀態碼: ${response.status}`);
                
                const data = await response.json();
                
                if (!response.ok) {
                    const errorMsg = data.error || `HTTP ${response.status}: ${response.statusText}`;
                    
                    // 🔴 詳細錯誤日誌 - 包含所有可能的診斷信息
                    console.error('❌ [API 返回錯誤]', {
                        status: response.status,
                        statusText: response.statusText,
                        error: errorMsg,
                        responseType: response.headers.get('content-type'),
                        fullResponse: data,  // 完整的服務器响应
                        timestamp: new Date().toISOString()
                    });
                    
                    // 按錯誤類型提供詳細診斷
                    if (response.status === 404) {
                        console.error('❌ 404 錯誤: API 端點不存在或資源未找到');
                        console.error('請求 URL:', url);
                    } else if (response.status === 500) {
                        console.error('❌ 500 錯誤: 服務器內部錯誤');
                        console.error('服務器錯誤詳情:', data.details || data.error);
                    } else if (response.status === 503) {
                        console.error('❌ 503 錯誤: 服務暫時不可用（可能是 API 超時或過載）');
                    }
                    
                    alert('搜尋失敗: ' + errorMsg);
                    return;
                }
                
                console.log('✅ [API 成功] 卡牌搜尋結果:', {
                    source: data.source,
                    cardCount: data.cards ? data.cards.length : (data.results ? Object.keys(data.results).length : 0),
                    total: data.total || 0,
                    pages: data.pages || 0
                });
                
                currentCardSearch.results = data;
                displayCardSearchResults(data);
            } catch (error) {
                // 🔴 詳細的網路錯誤日誌
                console.error('❌ [網路/FETCH 錯誤] 卡牌搜尋失敗', {
                    name: error.name,
                    message: error.message,
                    stack: error.stack,
                    errorType: error.constructor.name,
                    timestamp: new Date().toISOString(),
                    searchParams: {
                        keyword: keyword,
                        source: source,
                        page: page,
                        limit: limit
                    }
                });
                
                // 診斷錯誤類型
                if (error.name === 'TypeError') {
                    console.error('💡 可能原因: 網路連接問題、CORS 錯誤或伺服器無響應');
                    console.error('請檢查: 1) 網路連接, 2) 瀏覽器網路標籤, 3) CORS Headers');
                } else if (error.message.includes('Failed to fetch')) {
                    console.error('💡 可能原因: CORS 被阻擋或跨域請求失敗');
                    console.error('請檢查服務器的 CORS 設置');
                }
                
                // 詳細診斷信息
                const errorDetails = {
                    '時間': new Date().toISOString(),
                    '關鍵字': keyword,
                    '源': source,
                    '錯誤類型': error.name,
                    '錯誤信息': error.message
                };
                
                console.error('📋 [完整診斷信息]', errorDetails);
                alert('搜尋失敗: ' + error.message + '\n\n請檢查網路連接或查看瀏覽器控制台了解詳情');
            }
        }
        
        /** 顯示卡牌搜尋結果 */
        function displayCardSearchResults(data) {
            const container = document.getElementById('searchResults');
            const source = data.source;
            
            let html = '';
            
            // 顯示來源標題
            if (source === 'all') {
                // 顯示所有來源的結果
                const sources = ['pokemon', 'tw-pokemon', 'pokemon-jp', 'yugioh'];
                const results = data.results || {};
                
                sources.forEach(src => {
                    const srcData = results[src] || {};
                    if (srcData.cards && srcData.cards.length > 0) {
                        html += displayCardSource(src, srcData);
                    }
                });
            } else {
                // 顯示單一來源
                html += displayCardSource(source, data);
            }
            
            if (!html) {
                container.innerHTML = '<div class="no-results"><i class="fas fa-search"></i><h3>未找到卡牌</h3></div>';
                return;
            }
            
            container.innerHTML = html;
        }
        
        /** 顯示單一卡牌來源及其分頁 */
        function displayCardSource(source, data) {
            const cards = data.cards || [];
            const total = data.total || 0;
            const pages = data.pages || 0;
            const currentPage = data.current_page || 1;
            
            const sourceNames = {
                'pokemon': '⚡ 寶可夢 TCG (國際)',
                'yugioh': '🎴 遊戲王',
                'tw-pokemon': '🇹🇼 寶可夢 TCG (台灣繁中)',
                'pokemon-jp': '🇯🇵 寶可夢 TCG (日本官方)'
            };
            
            const sourceColors = {
                'pokemon': '#FF6B6B',
                'yugioh': '#FFD700',
                'tw-pokemon': '#FF6347',
                'pokemon-jp': '#E11D48'
            };
            
            let html = `
                <div class="platform-results">
                    <div class="platform-header" style="border-bottom-color: ${sourceColors[source] || '#999999'};">
                        <h2>${sourceNames[source] || source}</h2>
                        <span class="result-count">${cards.length} / ${total}</span>
                    </div>
                    <div class="card-grid">
                        ${cards.map(card => createCardElement(card, source)).join('')}
                    </div>
                    
                    <!-- 分頁控制 -->
                    ${pages > 1 ? createPaginationControls(source, currentPage, pages) : ''}
                </div>
            `;
            
            return html;
        }
        
        /** 創建卡牌元素 */
        function createCardElement(card, source) {
            const imageUrl = card.image_url || card.img_url || '';
            const displayName = card.name || card.title || '未命名卡牌';
            const cardKey = `card-${Math.random().toString(36).slice(2, 11)}`;
            currentSearchResults[cardKey] = card;
            const rarity = card.rarity || '未標示';
            const sourceName = getSourceName(card.source || source);
            const hasHp = card.hp !== undefined && card.hp !== null && card.hp !== '' && card.hp !== '-';

            return `
                <article class="catalog-card" onclick="showCardDetail(currentSearchResults['${cardKey}'])" tabindex="0"
                    onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();showCardDetail(currentSearchResults['${cardKey}'])}">
                    <div class="catalog-image">
                        <img src="${escapeHtml(imageUrl)}" alt="${escapeHtml(displayName)}" loading="lazy"
                            onerror="this.src='https://picsum.photos/280/390?random=${Math.random()}'">
                    </div>
                    <div class="catalog-info">
                        <div class="catalog-name">${escapeHtml(displayName)}</div>
                        <div class="detail-number">${escapeHtml(card.number || card.id || '-')}</div>
                        <div class="card-metadata">
                            ${hasHp ? `<span class="mini-chip mono">HP ${escapeHtml(card.hp)}</span>` : ''}
                            <span class="mini-chip">${escapeHtml(card.type || '未標示')}</span>
                            <span class="mini-chip">${escapeHtml(rarity)}</span>
                        </div>
                        <div style="display:flex;justify-content:space-between;gap:8px;align-items:end;margin-top:14px">
                            <span style="color:#64748b;font-size:.69rem;font-weight:700">${escapeHtml(sourceName)}</span>
                            <strong style="color:#475569;font-size:.76rem;text-align:right">${escapeHtml(card.series || '未標示')}</strong>
                        </div>
                    </div>
                </article>
            `;
        }
        /** 生成分頁控制按鈕 */
        function createPaginationControls(source, currentPage, totalPages) {
            let html = `<div style="margin-top: 2rem; display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap;">`;
            
            // 上一頁
            if (currentPage > 1) {
                html += `<button class="btn btn-sm btn-outline-primary" onclick="goToPage(${currentPage - 1})">← 上一頁</button>`;
            }
            
            // 頁碼顯示
            html += `<span style="padding: 0.4rem 0.8rem; background: #f0f0f0; border-radius: 4px;">第 ${currentPage} / ${totalPages} 頁</span>`;
            
            // 下一頁
            if (currentPage < totalPages) {
                html += `<button class="btn btn-sm btn-outline-primary" onclick="goToPage(${currentPage + 1})">下一頁 →</button>`;
            }
            
            html += '</div>';
            return html;
        }
        
        /** 轉到指定頁數 */
        function goToPage(page) {
            currentCardSearch.page = page;
            performCardSearch();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        /** 顯示國際卡牌結果 */
        function displayInternationalResults(data) {
            const container = document.getElementById('searchResults');
            const refs = data.references || {};
            
            let html = '';
            const cardConfig = {
                'yugioh': { name: '🎴 遊戲王', color: '#FFD700' },
                'pokemon': { name: '⚡ 寶可夢卡牌', color: '#FF6B6B' },
                'tw-pokemon': { name: '🇹🇼 繁中寶可夢', color: '#FF6347' },
                'pokemon-jp': { name: '🇯🇵 日版寶可夢', color: '#E11D48' }
            };

            for (const [source, cards] of Object.entries(refs)) {
                if (!cards || !cards.length) continue;
                const cfg = cardConfig[source] || { name: '卡牌資料', color: '#2563eb' };
                
                html += `
                    <div class="platform-results">
                        <div class="platform-header" style="border-bottom-color: ${cfg.color};">
                            <h2>${cfg.name}</h2>
                            <span class="result-count">${cards.length}</span>
                        </div>
                        <div class="card-grid">
                            ${cards.map(card => createCardDetail(card, source)).join('')}
                        </div>
                    </div>
                `;
            }

            container.innerHTML = html || '<div class="no-results"><i class="fas fa-search"></i><h3>未找到內容</h3></div>';
        }

        /** 創建卡牌詳細信息卡片 */
        function createCardDetail(card, source) {
            return createCardElement(card, source);
        }
        /** 輔助函數 */
        function handleKeyboardSearch(event) {
            if (event.key === 'Enter') performSearch();
        }

        function setupBottomSheet() {
            const modalEl = document.getElementById('cardModal');
            const content = modalEl.querySelector('.modal-content');
            const handle = modalEl.querySelector('.sheet-handle');
            let startY = 0;
            let offsetY = 0;
            let dragging = false;

            const resetSheet = () => {
                dragging = false;
                offsetY = 0;
                content.style.removeProperty('transition');
                content.style.removeProperty('transform');
            };

            handle.addEventListener('pointerdown', event => {
                dragging = true;
                startY = event.clientY;
                content.style.transition = 'none';
                handle.setPointerCapture(event.pointerId);
            });

            handle.addEventListener('pointermove', event => {
                if (!dragging) return;
                offsetY = Math.max(0, event.clientY - startY);
                content.style.transform = `translateY(${offsetY}px)`;
            });

            const finishDrag = () => {
                if (!dragging) return;
                dragging = false;
                content.style.removeProperty('transition');
                if (offsetY > 110) {
                    bootstrap.Modal.getOrCreateInstance(modalEl).hide();
                } else {
                    content.style.transform = 'translateY(0)';
                    window.setTimeout(resetSheet, 260);
                }
            };

            handle.addEventListener('pointerup', finishDrag);
            handle.addEventListener('pointercancel', finishDrag);
            modalEl.addEventListener('hidden.bs.modal', () => {
                resetSheet();
                if (holoTiltController) holoTiltController.abort();
                holoTiltController = null;
            });
        }

        /** 頁面載入時初始化圖鑑模式 */
        document.addEventListener('DOMContentLoaded', function() {
            setupBottomSheet();
            document.getElementById('cardSource').value = 'all';
            changeCardSource('all');
        });

        // ---------- 影像特徵辨識邏輯 ----------
        let cameraStream = null;
        let scanInterval = null;
        let facingMode = 'environment';
        let matchRequestInFlight = false;
        const scanStatusEl = document.getElementById('scan-status');
        const scannerShell = document.getElementById('scannerModal');
        const scannerStatusLabel = document.getElementById('scanner-status-label');

        function setScannerState(state, message) {
            scannerShell.classList.toggle('locked', state === 'locked');
            scannerShell.dataset.state = state;
            const labels = {
                idle: '準備掃描',
                scanning: '掃描中',
                target: '正在確認',
                locked: '辨識完成',
                error: '相機無法使用'
            };
            scannerStatusLabel.textContent = labels[state] || labels.idle;
            if (message) scanStatusEl.textContent = message;
        }

        async function startCamera() {
            if (cameraStream) cameraStream.getTracks().forEach(track => track.stop());
            const video = document.getElementById('camera-video');
            setScannerState('scanning', '卡牌靠近藍框即可，不需要完全重合');
            cameraStream = await navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: { ideal: facingMode },
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                },
                audio: false
            });
            video.srcObject = cameraStream;
            await video.play();
            if (scanInterval) clearInterval(scanInterval);
            scanInterval = setInterval(captureAndMatch, 800);
        }

        async function openScanner() {
            const modal = bootstrap.Modal.getOrCreateInstance(scannerShell);
            modal.show();
            try {
                await startCamera();
            } catch (error) {
                console.error('相機權限遭拒或發生錯誤:', error);
                setScannerState('error', '無法啟動相機，請確認權限並使用 HTTPS 或 localhost');
            }
            scannerShell.addEventListener('hidden.bs.modal', () => stopScanner(), { once: true });
        }

        async function switchCamera() {
            facingMode = facingMode === 'environment' ? 'user' : 'environment';
            try {
                setScannerState('scanning', '正在切換鏡頭…');
                await startCamera();
            } catch (error) {
                console.error('切換鏡頭失敗:', error);
                setScannerState('error', '找不到可切換的相機');
            }
        }

        function stopScanner(preserveState = false) {
            if (scanInterval) {
                clearInterval(scanInterval);
                scanInterval = null;
            }
            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
                cameraStream = null;
            }
            matchRequestInFlight = false;
            if (!preserveState) setScannerState('idle', '相機已關閉');
        }

        async function captureAndMatch() {
            const video = document.getElementById('camera-video');
            const canvas = document.getElementById('camera-canvas');
            const reticle = scannerShell.querySelector('.scanner-reticle');
            if (!video.videoWidth || !reticle || matchRequestInFlight) return;

            const videoRect = video.getBoundingClientRect();
            const reticleRect = reticle.getBoundingClientRect();
            const coverScale = Math.max(
                videoRect.width / video.videoWidth,
                videoRect.height / video.videoHeight
            );
            const renderedWidth = video.videoWidth * coverScale;
            const renderedHeight = video.videoHeight * coverScale;
            const hiddenX = (renderedWidth - videoRect.width) / 2;
            const hiddenY = (renderedHeight - videoRect.height) / 2;
            const capturePadding = 0.24;
            const paddedLeft = reticleRect.left - (reticleRect.width * capturePadding);
            const paddedTop = reticleRect.top - (reticleRect.height * capturePadding);
            const paddedWidth = reticleRect.width * (1 + capturePadding * 2);
            const paddedHeight = reticleRect.height * (1 + capturePadding * 2);
            const sourceX = Math.max(0, (paddedLeft - videoRect.left + hiddenX) / coverScale);
            const sourceY = Math.max(0, (paddedTop - videoRect.top + hiddenY) / coverScale);
            const sourceWidth = Math.min(video.videoWidth - sourceX, paddedWidth / coverScale);
            const sourceHeight = Math.min(video.videoHeight - sourceY, paddedHeight / coverScale);

            canvas.width = 630;
            canvas.height = 880;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(
                video,
                sourceX, sourceY, sourceWidth, sourceHeight,
                0, 0, canvas.width, canvas.height
            );
            await fetchMatchApi(canvas.toDataURL('image/jpeg', 0.88));
        }

        async function fetchMatchApi(base64Image) {
            matchRequestInFlight = true;
            try {
                const response = await fetch('/api/identify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: base64Image })
                });
                const data = await response.json();
                if (!response.ok || data.status !== 'success' || data.confidence < 47) {
                    currentMatchName = '';
                    matchCounter = 0;
                    setScannerState('scanning', '卡牌靠近藍框即可，不需要完全重合');
                    return;
                }

                const matchName = data.match?.name || '';
                if (matchName === currentMatchName) {
                    matchCounter += 1;
                } else {
                    currentMatchName = matchName;
                    matchCounter = 1;
                }

                if (matchCounter >= 2) {
                    setScannerState('locked', `已鎖定 ${matchName} · ${Math.round(data.confidence)}%`);
                    if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
                    onScanMatched(data);
                    currentMatchName = '';
                    matchCounter = 0;
                } else {
                    setScannerState('target', `正在確認 ${matchName} · ${matchCounter}/2`);
                }
            } catch (error) {
                console.error('影像比對請求失敗:', error);
                setScannerState('error', '辨識服務暫時無法連線');
            } finally {
                matchRequestInFlight = false;
            }
        }
        function onScanMatched(data) {
            const matchName = data.match?.name || '未知卡牌';
            console.log(`影像辨識成功: ${matchName} (置信度: ${data.confidence}%)`);
            
            // 暫停相機
            stopScanner(true);
            
            if (navigator.vibrate) navigator.vibrate(200);
            setScannerState('locked', `成功辨識：${matchName}`);
            
            setTimeout(() => {
                const modalEl = document.getElementById('scannerModal');
                const modalInst = bootstrap.Modal.getInstance(modalEl);
                if (modalInst) modalInst.hide();
                
                // 若有爬蟲抓到的卡牌資料，直接打開卡牌詳情
                if (data.cards && data.cards.length > 0) {
                    const card = data.cards[0];
                    const validSources = ['all', 'tw-pokemon', 'pokemon-jp', 'pokemon', 'yugioh'];
                    const cardSource = validSources.includes(card.source) ? card.source : 'all';
                    document.getElementById('cardSource').value = cardSource;
                    changeCardSource(cardSource);
                    document.getElementById('searchKeyword').value = matchName;
                    window.setTimeout(() => showCardDetail(card), 180);
                } else {
                    document.getElementById('searchKeyword').value = matchName;
                    document.getElementById('cardSource').value = 'tw-pokemon';
                    changeCardSource('tw-pokemon');
                    performSearch();
                }
            }, 800);
        }
    </script>
